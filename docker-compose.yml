services:
  rewardhub:
    image: ghcr.io/leenkon/rewardhub:latest
    container_name: rewardhub
    ports:
      - "9696:9696"
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_USERNAME_B64: "${ADMIN_USERNAME_B64:-}"
      ADMIN_PASSWORD_B64: "${ADMIN_PASSWORD_B64:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
    volumes:
      - ./points_data:/data
    restart: unless-stopped
